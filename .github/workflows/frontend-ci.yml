name: Frontend CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "IntellMeet-Frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [develop]
    paths:
      - "IntellMeet-Frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IntellMeet-Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: IntellMeet-Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build
